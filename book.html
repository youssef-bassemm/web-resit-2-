<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment - MedCare Clinic</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">MedCare <span>Clinic</span></a>
      <nav id="main-nav"></nav>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title">Book an Appointment</h2>

    <div class="form-box" style="max-width:500px;">
      <form id="book-form">
        <label>
          Your Name
          <input type="text" id="patient-name" required />
        </label>
        <label>
          Doctor
          <select id="doctor-select" required>
            <option value="">-- Select a doctor --</option>
          </select>
        </label>
        <label>
          Date
          <input type="date" id="appointment-date" required />
        </label>
        <label>
          Time
          <input type="time" id="appointment-time" required />
        </label>
        <button type="submit">Confirm Booking</button>
      </form>
      <p id="msg" class="message"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <h4>MedCare Clinic</h4>
        <p>123 Health Street, Medical City</p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('redirect');

    const params = new URLSearchParams(window.location.search);
    const preselectedDoctor = params.get('doctor');

    async function loadDoctors() {
      const select = document.getElementById('doctor-select');
      const res = await api('/api/v1/doctors');

      if (res.status !== 200 || !Array.isArray(res.data)) return;

      res.data.forEach((doc) => {
        const opt = document.createElement('option');
        opt.value = doc.ID;
        opt.textContent = `${doc.NAME} - ${doc.SPECIALIZATION}`;
        select.appendChild(opt);
      });

      if (preselectedDoctor) {
        select.value = preselectedDoctor;
      }
    }

    const user = getUser();
    if (user && user.email) {
      document.getElementById('patient-name').value = user.email.split('@')[0];
    }

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('appointment-date').min = today;

    document.getElementById('book-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');

      const res = await api('/api/v1/appointments', {
        method: 'POST',
        body: JSON.stringify({
          patientName: document.getElementById('patient-name').value.trim(),
          doctorId: Number(document.getElementById('doctor-select').value),
          appointmentDate: document.getElementById('appointment-date').value,
          appointmentTime: document.getElementById('appointment-time').value,
        }),
      });

      if (res.status === 201) {
        showMessage(msg, 'Appointment booked! View it in My Appointments.', false);
        setTimeout(() => { window.location.href = '/appointments.html'; }, 1500);
      } else {
        showMessage(msg, res.data.message || 'Booking failed.', true);
      }
    });

    loadDoctors();
  </script>
</body>
</html>
